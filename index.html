function stop(){serial++;pending=null;if('speechSynthesis'in window)speechSynthesis.cancel();status('Áudio parado.');}
function voices(){return speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang)).sort((a,b)=>score(b)-score(a));}
function score(v){return (/^en[-_]US$/i.test(v.lang)?100:0)+(/natural|neural|online|premium|enhanced/i.test(v.name)?60:0)+(/google us english|samantha|aria|jenny|ava/i.test(v.name)?30:0);}
function speechText(t){return t.replace(/I lost my passport \/ luggage\./,"I lost my passport. I lost my luggage.").replace(/…|\.\.\./g,'').replace(/[’]/g,"'");}
function speak(t){stop();if(!('speechSynthesis'in window)||!('SpeechSynthesisUtterance'in window)){status('Áudio indisponível. Continue a prática pelo texto.');return;}const token=serial;const play=()=>{if(token!==serial)return;const available=voices();if(!available.length){status('Nenhuma voz em inglês disponível. Instale uma voz English (United States) no aparelho ou use outro navegador.');return;}const u=new SpeechSynthesisUtterance(speechText(t));u.voice=available.find(v=>v.name===voiceName)||available[0];u.lang=u.voice.lang;u.rate=rate;u.pitch=1;window.currentCardSpeech=u;u.onstart=()=>{if(token===serial)status('Reproduzindo com '+u.voice.name+'…')};u.onend=()=>{if(token===serial)status('Áudio concluído.')};u.onerror=e=>{if(token===serial&&!['canceled','interrupted'].includes(e.error))status('Não foi possível reproduzir. Tente outra voz em inglês.');};speechSynthesis.resume();speechSynthesis.speak(u);};if(voices().length)play();else{status('Carregando vozes…');pending=play;setTimeout(()=>{if(pending===play){pending=null;play()}},1500)}}
function audio(){return `<details class="audio"><summary>Configurações de áudio</summary><div class="row"><label>Velocidade <select id="speed"><option value="0.8">Lenta</option><option value="1">Normal</option></select></label><label>Voz <select id="voice"><option value="">Melhor voz disponível</option></select></label><button data-action="stop">■ Parar</button><button data-say="Could you help me?">▷ Testar voz</button></div><p class="muted">O jogo prioriza vozes naturais em inglês americano disponíveis no aparelho. Frases com “...” são estruturas para completar. No último cartão, o áudio lê as duas alternativas.</p></details><p id="audioStatus" role="status" aria-live="polite"></p>`}
function fillVoices(){const e=document.querySelector('#voice');if(e){e.innerHTML='<option value="">Melhor voz disponível</option>'+('speechSynthesis'in window?voices():[]).map(v=>`<option value="${esc(v.name)}">${esc(v.name)} (${esc(v.lang)})</option>`).join('');e.value=voiceName;}if(pending){const p=pending;pending=null;p();}}
function setupAudio(){fillVoices();const s=document.querySelector('#speed');if(s)s.value=rate;}
function home(){stop();app.innerHTML=`<span class="tag">Inglês de viagem · 16 cartões · 6 temas</span><h1 lang="en">Travel <em>Cards.</em></h1><p class="muted">Frases pequenas. Mais confiança para viajar. Vire os cartões, pratique em voz alta e teste sua memória.</p><section class="panel"><div class="row"><label>Tema <select id="category"><option>Todas</option>${categories.map(c=>`<option>${c}</option>`).join('')}</select></label><label>Direção <select id="direction"><option value="pt">Português → Inglês</option><option value="en">Inglês → Português</option></select></label></div><div class="grid"><button class="mode" data-start="study"><strong>01 · Explorar cartões ↗</strong><span>Vire, ouça e marque: “Lembrei” ou “Quero revisar”.</span></button><button class="mode coral" data-start="quiz"><strong>02 · Desafio da memória ↗</strong><span>Escolha a tradução certa e conquiste pontos.</span></button></div><p class="muted">Sem cronômetro. Cada acerto no desafio vale 10 pontos. Melhor resultado neste navegador: ${best} pontos.</p></section><details><summary>Como jogar</summary><p>Escolha um tema ou pratique todas as 16 expressões da imagem. Em Explorar, tente lembrar antes de virar. No Desafio, escolha uma tradução: a resposta correta aparece com feedback. Ao terminar, revise apenas os cartões que marcar ou errar.</p><p>“I’d like...”, por exemplo, é uma estrutura aberta: complete com seu pedido. “Passport / luggage” apresenta duas alternativas. O jogo pratica linguagem; em uma emergência real, procure ajuda local.</p><p>O melhor resultado é salvo apenas neste navegador, se permitido.</p></details>${audio()}`;document.querySelector('#category').value=category;document.querySelector('#direction').value=direction;setupAudio();}
function start(m,ids){stop();mode=m;deck=shuffle(ids?ids.map(id=>cards[id]):cards.filter(c=>category==='Todas'||c.category===category));index=0;correct=0;misses=[];round=deck.length;flipped=false;answered=false;draw();}
function draw(){stop();if(index>=deck.length){finish();return;}const c=deck[index],front=direction==='pt'?c.pt:c.en,back=direction==='pt'?c.en:c.pt;app.innerHTML=`<div class="row"><button data-action="home">← Início</button><button data-action="restart">↻ Recomeçar</button><span class="chip">${mode==='quiz'?'Desafio':'Explorar'} · ${index+1} / ${round}</span>${mode==='quiz'?`<span class="chip">${correct*10} pontos</span>`:''}</div><progress max="${round}" value="${index}" aria-label="Cartões concluídos"></progress><p class="tag">${esc(c.category)}</p><h2 id="title" tabindex="-1">${mode==='quiz'?'Qual é a tradução?':'Tente lembrar antes de virar.'}</h2>${mode==='study'?`<button class="card" data-action="flip" aria-label="Virar cartão"><small>${flipped?'RESPOSTA':(direction==='pt'?'PORTUGUÊS':'ENGLISH')}</small><span class="phrase" lang="${(flipped?direction==='pt':direction==='en')?'en':'pt-BR'}">${esc(flipped?back:front)}</span><span>↻ Toque para ${flipped?'ver a frente':'revelar a resposta'}</span></button>${flipped||direction==='en'?audioButton(c.en):'<p class="muted">O áudio em inglês aparece ao revelar a resposta.</p>'}<div class="row"><button data-mark="review" ${!flipped?'disabled':''}>Quero revisar</button><button class="primary" data-mark="known" ${!flipped?'disabled':''}>✓ Lembrei</button></div>`:`<div class="panel"><p class="phrase" lang="${direction==='en'?'en':'pt-BR'}" style="font-size:26px">${esc(front)}</p>${direction==='en'?audioButton(c.en):''}</div><p class="muted">Escolha a tradução correspondente.</p><div class="options">${quizOptions(c).map(o=>`<button data-answer="${o.id}" lang="${direction==='pt'?'en':'pt-BR'}">${esc(direction==='pt'?o.en:o.pt)}</button>`).join('')}</div><div id="feedback" role="status" aria-live="polite"></div><button class="primary" id="next" data-action="next" hidden>Próximo cartão →</button>`}${audio()}`;setupAudio();document.querySelector('#title').focus();}
function quizOptions(c){return shuffle([c,...shuffle(cards.filter(x=>x.id!==c.id)).slice(0,3)]);}
function answer(id){if(answered)return;answered=true;const c=deck[index],ok=id===c.id;if(ok)correct++;else misses.push(c.id);document.querySelectorAll('[data-answer]').forEach(b=>b.disabled=true);document.querySelector('#feedback').innerHTML=`<div class="feedback ${ok?'good':''}"><strong>${ok?'✓ Muito bem! +10 pontos':'Vamos guardar esta para revisar.'}</strong><p lang="en">${esc(c.en)}</p><p>${esc(c.pt)}</p>${audioButton(c.en)}<p class="muted">${c.en.includes('...')?'Complete a expressão com o que você precisa.':c.id===15?'Use passport para passaporte ou luggage para bagagem.':'Ouça e repita a frase em voz alta.'}</p></div>`;document.querySelector('#next').hidden=false;}
function advance(){index++;flipped=false;answered=false;draw();}
function finish(){stop();if(mode==='quiz'&&correct*10>best){best=correct*10;try{localStorage.setItem('cafeCardsBest',best)}catch{}}app.innerHTML=`<span class="tag">Rodada concluída</span><h1 id="done" tabindex="-1">Well <em>done!</em></h1><p>${mode==='quiz'?`Você acertou ${correct} de ${round} cartões e conquistou ${correct*10} pontos.`:`Você praticou ${round} cartões e marcou ${round-misses.length} como lembrados.`}</p><p>${misses.length?`${misses.length} cartões para reforçar. Cada repetição ajuda!`:'Todos os cartões desta rodada foram lembrados. Que tal praticar na outra direção?'}</p><div class="row">${misses.length?'<button class="primary" data-action="review">Revisar só estes cartões →</button>':''}<button data-action="restart">↻ Jogar novamente</button><button data-action="home">Escolher tema</button></div><details class="panel"><summary>Revisar as frases da rodada</summary>${deck.map(c=>`<div class="list-item"><span class="chip">${misses.includes(c.id)?'Revisar':'✓ Praticado'}</span><p lang="en"><strong>${esc(c.en)}</strong></p><p>${esc(c.pt)}</p>${audioButton(c.en)}</div>`).join('')}</details>${audio()}`;setupAudio();document.querySelector('#done').focus();}
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.say!==undefined){speak(b.dataset.say);return;}if(b.dataset.start){start(b.dataset.start);return;}if(b.dataset.answer!==undefined){answer(+b.dataset.answer);return;}if(b.dataset.mark){if(!flipped)return;if(b.dataset.mark==='review')misses.push(deck[index].id);advance();return;}switch(b.dataset.action){case'home':home();break;case'flip':flipped=!flipped;draw();break;case'restart':start(mode,deck.map(c=>c.id));break;case'next':if(answered)advance();break;case'review':start('study',[...new Set(misses)]);break;case'stop':stop();break;}});
app.addEventListener('change',e=>{switch(e.target.id){case'category':category=e.target.value;break;case'direction':direction=e.target.value;break;case'speed':rate=+e.target.value;stop();break;case'voice':voiceName=e.target.value;stop();break;}});
if('speechSynthesis'in window)speechSynthesis.addEventListener('voiceschanged',fillVoices);window.addEventListener('pagehide',stop);home();
</script></body></html>
